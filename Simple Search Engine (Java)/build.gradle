plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'idea'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'search.Main'
}

tasks.withType(JavaCompile) {
    options.encoding = 'utf-8'
}

// 'stages' keeps the earlier Hyperskill stage solutions for reference. Each file there
// declares another `search.Main`, so it must stay out of the source sets and out of the
// IDE's view.
idea {
    module {
        excludeDirs += file('stages')
    }
}

run {
    standardInput = System.in
    if (project.hasProperty('data')) {
        args '--data', project.property('data')
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        csv.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.8
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
